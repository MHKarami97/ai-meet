<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>AI Meet</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand"><span class="logo-dot"></span> AI Meet</div>
      <button id="openOptionsBtn" class="icon-btn" title="تنظیمات">⚙️</button>
    </header>

    <div class="search-row">
      <input id="searchInput" type="text" placeholder="جست‌وجو در تاریخچه جلسات..." />
    </div>

    <div class="layout">
      <aside class="meeting-list" id="meetingList"></aside>

      <main class="meeting-detail" id="meetingDetail">
        <div class="empty-state">یک جلسه را از لیست انتخاب کنید یا منتظر شروع جلسه در Google Meet بمانید.</div>
      </main>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
